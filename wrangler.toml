# Wealth Platform 2036 – MVP1 demo trên Cloudflare (BRD Mục 11.7). Phương án B: TypeScript (Hono + D1).
name = "wealth-platform" # trùng tên Worker đã tạo trên dashboard (Workers Builds)
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Giữ biến đặt trên dashboard (ACCESS_*, DEMO_OPERATORS, ROLE_MAP) khi deploy lại
keep_vars = true

[vars]
AGENT_MODE = "auto"   # auto: có ANTHROPIC_API_KEY thì gọi Claude qua API (live); chưa có thì Claude chạy agent trong phiên làm việc và đẩy kết quả lên (external) · mock · live · external
PRICE_MODE = "sample" # sample | live (live cần thỏa thuận dữ liệu và thông tin truy cập nguồn)
AUTH_MODE = "access"  # access: chỉ tin JWT Cloudflare Access đã xác minh. dev: chỉ dùng trên máy (.dev.vars)
ACCESS_TEAM_DOMAIN = "bitter-tree-c714.cloudflareaccess.com" # team Cloudflare Access (khóa ký JWT lấy từ /cdn-cgi/access/certs)
# Tùy chọn, đặt trên dashboard: ACCESS_AUD (chỉ nhận JWT của đúng ứng dụng này), DEMO_OPERATORS, ROLE_MAP (xem README)
# Kiểm soát bổ sung (tắt mặc định để một người vận hành vẫn chạy được toàn bộ demo; /api/health liệt kê cái nào đang tắt):
#   SOD_STRICT = "on"        tách bạch nhiệm vụ theo email đã xác minh, không chỉ theo mã người dùng demo
#   EXTERNAL_HMAC_KEY (secret) bản ghi của vùng AI phải có chữ ký HMAC; bật kênh POST /api/external/submit
#   AUDIT_HMAC_KEY (secret)    nhật ký dùng HMAC thay SHA-256 thường
#   INTERPRETATION_LLM = "internal"  chỉ đặt khi mô hình AI chạy trong hạ tầng ngân hàng (diễn giải có dữ liệu gia đình)

[[d1_databases]]
binding = "DB"
database_name = "wealth-mvp1" # tên D1 trên tài khoản Cloudflare (khớp các lệnh npm run db:*, seed:*)
# D1 đã tạo trên tài khoản Cloudflare (APAC); schema 0001 đã áp dụng
database_id = "792b4d3a-39fc-498c-b6a2-4d3d7ebe234c"
migrations_dir = "migrations"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Mỗi 10 phút: lấy tin RSS công khai (ingest.ts) và nhập kết quả Claude đẩy lên (external.ts)
[triggers]
crons = ["*/10 * * * *"]

# Chạy nền các lượt agent ở chế độ live (src/worker/workflow.ts); chế độ mock vẫn chạy trực tiếp trong yêu cầu
[[workflows]]
name = "wealth-agent-jobs"
binding = "AGENT_JOBS"
class_name = "AgentJobs"

[observability]
enabled = true
